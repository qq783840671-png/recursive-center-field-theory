<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">递归偏序多中心动态场域论：从完整场投影到版本化返回</title>
  <desc id="desc">任务相对场契约经关系全景、多中心候选与必要偏序审计，投影一个选中中心进入 Focus 运行面；只在必要位置打开一层或执行，随后分别审计选中中心和完整场闭合，以剩余触发重审并进入版本化返回。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071527"/>
      <stop offset="0.58" stop-color="#0A1D35"/>
      <stop offset="1" stop-color="#071A2C"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102A49" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0B223C" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="accentCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#103F61"/>
      <stop offset="1" stop-color="#0C2C4A"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35D7E5"/>
      <stop offset="1" stop-color="#4CA7FF"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020914" flood-opacity="0.38"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#45C7EE"/>
    </marker>
    <style>
      .zh { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .en { font-family: Inter, "Segoe UI", sans-serif; letter-spacing: .12em; }
      .mono { font-family: "Cascadia Mono", Consolas, monospace; }
      .card { fill: url(#card); stroke: #2D668F; stroke-width: 1.2; filter: url(#shadow); }
      .card-accent { fill: url(#accentCard); stroke: #3CBBD4; stroke-width: 1.35; filter: url(#shadow); }
      .step { fill: #55D4EE; font: 600 12px Inter, "Segoe UI", sans-serif; letter-spacing: .08em; }
      .main { fill: #F3FAFF; font: 600 18px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .sub { fill: #8FB2CC; font: 400 12px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .math { fill: #E9F8FF; font: 600 18px "Cascadia Mono", Consolas, monospace; }
      .flow { fill: none; stroke: #45C7EE; stroke-width: 2; marker-end: url(#arrow); }
      .flow-dim { fill: none; stroke: #2C719B; stroke-width: 1.5; marker-end: url(#arrow); stroke-dasharray: 5 5; }
      .chip { fill: #0B1B31; stroke-width: 1; }
      .chip-text { font: 600 11px "Cascadia Mono", Consolas, monospace; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1120" cy="50" r="210" fill="#0E4A73" opacity="0.14"/>
  <circle cx="1120" cy="50" r="125" fill="#1CBACD" opacity="0.06"/>
  <path d="M0 562 C290 510 515 635 820 560 C1020 510 1145 525 1280 480 L1280 640 L0 640Z" fill="#0A2944" opacity="0.42"/>
  <g opacity="0.22" stroke="#2D79A4" stroke-width="1">
    <path d="M36 122 H1244"/>
    <path d="M36 574 H1244"/>
  </g>

  <g transform="translate(52 34)">
    <rect x="0" y="2" width="5" height="64" rx="2.5" fill="url(#cyan)"/>
    <text class="zh" x="22" y="30" fill="#F5FBFF" font-size="24" font-weight="700">递归偏序多中心动态场域论</text>
    <text class="en" x="23" y="56" fill="#78B8D6" font-size="10" font-weight="600">RECURSIVE PARTIAL-ORDER MULTI-CENTER DYNAMIC FIELD THEORY</text>
  </g>
  <g transform="translate(869 49)">
      <text class="zh" x="0" y="0" fill="#8FB2CC" font-size="12">多中心全景 · 单中心 Focus · 剩余触发重审</text>
    <path d="M0 18 H328" stroke="url(#cyan)" stroke-width="2" opacity=".7"/>
  </g>

  <!-- Upper sequence: 01–04 -->
  <g transform="translate(52 154)">
    <rect class="card-accent" width="260" height="118" rx="14"/>
    <text class="step" x="18" y="25">01 · ROOT</text>
    <text class="math" x="18" y="55">根目标 F0</text>
    <text class="main" x="18" y="82">场契约</text>
    <text class="sub" x="18" y="104">目标 · 边界 · 成功条件</text>
  </g>
  <path class="flow" d="M318 213 H348"/>

  <g transform="translate(354 154)">
    <rect class="card" width="260" height="118" rx="14"/>
    <text class="step" x="18" y="25">02 · RELATIONS</text>
    <text class="math" x="18" y="55">G</text>
    <text class="main" x="50" y="55">场内关系结构</text>
    <text class="sub" x="18" y="82">当前证据下保留语义、因果与反馈</text>
    <text class="sub" x="18" y="104">不把关系图误当执行顺序</text>
  </g>
  <path class="flow" d="M620 213 H650"/>

  <g transform="translate(656 154)">
    <rect class="card" width="260" height="118" rx="14"/>
    <text class="step" x="18" y="25">03 · ORDER</text>
    <text class="math" x="18" y="55">Π + 𝒦 → Kᵛ</text>
    <text class="main" x="154" y="55">候选审计</text>
    <text class="sub" x="18" y="82">必要前序偏序 · 候选可多于一个</text>
    <text class="sub" x="18" y="104">校验后选择当前承重中心</text>
  </g>
  <path class="flow" d="M922 213 H952"/>

  <g transform="translate(958 154)">
    <rect class="card-accent" width="270" height="118" rx="14"/>
      <text class="step" x="18" y="25">04 · FOCUS 1 / 2</text>
      <text class="main" x="18" y="55">中心投影</text>
    <text class="mono" x="109" y="55" fill="#62D5EA" font-size="14">/</text>
      <text class="main" x="125" y="55">一层展开</text>
      <text class="sub" x="18" y="82">保留平级接口 / 只打开必要地址</text>
      <text class="sub" x="18" y="104">Center Projection / One-layer Expansion</text>
  </g>

  <!-- Turn to lower sequence -->
  <path class="flow" d="M1228 213 H1246 V409 H1226"/>

  <!-- Three frontier band -->
  <g transform="translate(207 302)">
    <text class="en" x="0" y="18" fill="#6597B5" font-size="10">THREE FRONTIERS</text>
    <rect class="chip" x="150" y="0" width="188" height="30" rx="15" stroke="#37CFE1"/>
    <circle cx="167" cy="15" r="4" fill="#37CFE1"/>
    <text class="chip-text" x="180" y="19" fill="#A5EDF5">ActionFrontier</text>
    <rect class="chip" x="350" y="0" width="205" height="30" rx="15" stroke="#4DA8FF"/>
    <circle cx="367" cy="15" r="4" fill="#4DA8FF"/>
    <text class="chip-text" x="380" y="19" fill="#ADD5FF">ExpansionFrontier</text>
    <rect class="chip" x="567" y="0" width="170" height="30" rx="15" stroke="#8C86FF"/>
    <circle cx="584" cy="15" r="4" fill="#8C86FF"/>
    <text class="chip-text" x="597" y="19" fill="#C8C5FF">Compressed</text>
  </g>
  <path d="M335 340 H944" stroke="#234C6B" stroke-width="1" stroke-dasharray="3 6"/>

  <!-- Lower sequence runs right to left: 05–08 -->
  <g transform="translate(958 352)">
    <rect class="card" width="270" height="118" rx="14"/>
    <text class="step" x="18" y="25">05 · READINESS</text>
    <text class="math" x="18" y="56">Dₜ / Readyₜ</text>
    <text class="main" x="18" y="84">偏序执行就绪集</text>
    <text class="sub" x="18" y="106">只开放依赖已满足的动作</text>
  </g>
  <path class="flow" d="M952 411 H922"/>

  <g transform="translate(656 352)">
    <rect class="card-accent" width="260" height="118" rx="14"/>
    <text class="step" x="18" y="25">06 · COMMIT</text>
    <text class="main" x="18" y="55">Execute / Audit</text>
    <g transform="translate(18 72)">
      <rect x="0" y="0" width="68" height="28" rx="14" fill="#10283F" stroke="#9E91FF"/>
      <text class="mono" x="18" y="19" fill="#CEC7FF" font-size="13">[◇]</text>
      <path d="M79 14 H118" stroke="#45D4E9" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="129" y="0" width="68" height="28" rx="14" fill="#103648" stroke="#35D6B5"/>
      <text class="mono" x="149" y="19" fill="#9BF2DA" font-size="13">[+]</text>
    </g>
  </g>
  <path class="flow" d="M650 411 H620"/>

  <g transform="translate(354 352)">
    <rect class="card" width="260" height="118" rx="14"/>
    <text class="step" x="18" y="25">07 · RESIDUAL</text>
    <text class="math" x="18" y="56">Rₜ + χₜ</text>
      <text class="main" x="18" y="84">剩余与证书失效</text>
      <text class="sub" x="18" y="106">触发重审，不冒充独立物理力</text>
  </g>
  <path class="flow" d="M348 411 H318"/>

  <g transform="translate(52 352)">
    <rect class="card-accent" width="260" height="118" rx="14"/>
    <text class="step" x="18" y="25">08 · RECONSTRUCT</text>
      <text class="main" x="18" y="56">Fold / Unwind 返回</text>
    <text class="mono" x="18" y="84" fill="#7DDDED" font-size="13">Fᵛ → Fᵛ⁺¹</text>
    <text class="sub" x="118" y="84">保留路径与变更历史</text>
      <text class="sub" x="18" y="106">Versioned Return / Reconstruction</text>
  </g>

  <!-- Reconstruction returns to field contract without implying a fixed final center -->
  <path class="flow-dim" d="M52 411 H30 V213 H46"/>
  <text class="zh" x="37" y="307" fill="#5F9ABC" font-size="10" transform="rotate(-90 37 307)">重建后重新检验场契约</text>

  <g transform="translate(52 522)">
    <circle cx="5" cy="7" r="5" fill="#42CFE2" filter="url(#glow)"/>
      <text class="zh" x="20" y="12" fill="#B0C8D8" font-size="13">完整场可多中心；一次 Focus 只运行一个中心，并返回完整场重审。</text>
  </g>
  <g transform="translate(953 522)">
    <text class="mono" x="0" y="12" fill="#6E9BB7" font-size="11">explicit · ordered · versioned</text>
  </g>
</svg>
