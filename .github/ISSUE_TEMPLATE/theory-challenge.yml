name: Theory challenge
description: Report a contradiction, counterexample, scope error, or evidence overstatement.
title: "[Theory]: "
labels: ["theory-review"]
body:
  - type: input
    id: target
    attributes:
      label: Exact target
      description: Give the heading and claim in THEORY.md.
    validations:
      required: true
  - type: textarea
    id: challenge
    attributes:
      label: Contradiction, counterexample, or evidence
    validations:
      required: true
  - type: textarea
    id: repair
    attributes:
      label: Proposed scope or repair
      description: Explain whether the claim should be rejected, narrowed, relabeled, or kept open.
    validations:
      required: true
  - type: checkboxes
    id: discipline
    attributes:
      label: Evidence discipline
      options:
        - label: I distinguished theory, implementation behavior, hypothesis, and empirical evidence.
          required: true
        - label: I removed private or copyrighted material I cannot publish.
          required: true
