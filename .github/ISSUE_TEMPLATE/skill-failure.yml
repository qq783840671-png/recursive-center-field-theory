name: Runtime or Skill failure
description: Report a reproducible Focus, Address, Distill, packaging, or execution failure.
title: "[Failure]: "
labels: ["skill-failure"]
body:
  - type: textarea
    id: field-contract
    attributes:
      label: Field contract and acceptance condition
      description: State the goal, boundary, closure gap, evidence standard, and what counted as complete.
    validations:
      required: true
  - type: textarea
    id: invocation
    attributes:
      label: Invocation and minimal input
      description: Include the exact Focus invocation and the smallest non-private input that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected legal structure or behavior
      description: Describe the expected Focus-1 gate, selected center, predecessor rule, address, action, Fold/Unwind result, or residual classification.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include relevant state version, address, modal status, evidence, and residual output.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Codex surface, operating system, Python version, Skill or Plugin version, and schema version.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Reproduction checks
      options:
        - label: I reproduced this against the current release or explained why I could not.
          required: true
        - label: I distinguished a runtime defect from disagreement with a theory claim.
          required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private conversations, unpublished manuscripts, and unrelated workspace material.
          required: true
