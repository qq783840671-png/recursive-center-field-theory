name: Focus failure
description: Report reproducible Focus Skill, runtime, packaging, or installation behavior.
title: "[Focus]: "
labels: ["skill-failure"]
body:
  - type: textarea
    id: contract
    attributes:
      label: Task contract
      description: State the goal, boundary, constraints, evidence, and completion condition.
    validations:
      required: true
  - type: textarea
    id: invocation
    attributes:
      label: Invocation and minimal input
      description: Include the exact Focus invocation and smallest non-private reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Codex surface, operating system, Python version, and Focus version.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed credentials, private conversations, and unrelated project material.
          required: true
