name: Focus Skill failure
description: Report a reproducible modeling, address, execution, or residual-audit failure.
title: "[Failure]: "
labels: ["skill-failure"]
body:
  - type: textarea
    id: root-goal
    attributes:
      label: Root goal F0 and acceptance condition
      description: State the task goal, boundary, and what counted as complete.
    validations:
      required: true
  - type: textarea
    id: invocation
    attributes:
      label: Invocation and minimal input
      description: Include the exact Focus invocation and the smallest non-private input that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected legal structure or behavior
      description: Describe the expected center, predecessor gate, address, Ready action, or residual classification.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include relevant state version, address, modal status, evidence, and residual output.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Codex surface, operating system, Python version, Skill or Plugin version, and schema version.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private conversations, unpublished manuscripts, and unrelated workspace material.
          required: true
