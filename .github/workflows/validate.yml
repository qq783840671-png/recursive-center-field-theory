name: Validate Focus Field

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile runtime
        run: python -m py_compile plugin/skills/focus/scripts/focus_runtime.py
      - name: Run public tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate comparison suite
        working-directory: evals/focus-comparison
        run: python run.py validate --suite datasets/pilot_tasks.json
      - name: Test comparison harness
        working-directory: evals/focus-comparison
        run: python -m unittest discover -s tests -v
